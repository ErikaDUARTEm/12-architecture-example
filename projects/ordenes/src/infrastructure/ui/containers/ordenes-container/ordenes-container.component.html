<lib-get-ordenes
  [ordenes]= "ordenes$ | async"
  (onCreateOrden)="handlePatchOrden($event)"
  (onSelectOrden)="handleSelectOrden($event)"
  [currentOrden]="currentOrden$ | async"
  (onDeleteOrden)="deleteOrden($event)"
  (onStatusChange)="handleStatusChange($event)"
  [getAllOrdenes]="getAllOrdens$ |async"
  [currentpage]="currentPage$ | async"
  [totalPages]="totalPages$ | async"
  (onChangePage)="changePage($event)"
  ></lib-get-ordenes>
